<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>클라임픽 다운로드</title>
<script>
  // QR·공유용 다운로드 링크: 기기에 맞는 스토어로 바로 보냄 (Android → Google Play, iPhone/iPad/Mac → App Store, 그 외 → 랜딩)
  (function () {
    var ua = navigator.userAgent || "";
    var APP_STORE = "https://apps.apple.com/kr/app/id6789773061";
    var PLAY_STORE = "https://play.google.com/store/apps/details?id=com.climpick";
    var to = "/";
    if (/android/i.test(ua)) to = PLAY_STORE;
    else if (/iphone|ipad|ipod|macintosh/i.test(ua)) to = APP_STORE;
    location.replace(to);
  })();
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0E120E; color: #F1F5EF;
    font-family: "Apple SD Gothic Neo", "IBM Plex Sans KR", sans-serif; text-align: center; padding: 24px; }
  a { display: block; margin: 10px auto; padding: 12px 20px; border-radius: 12px; background: #5BE36A; color: #0E120E; font-weight: 700; text-decoration: none; max-width: 280px; }
</style>
</head>
<body>
  <noscript>
    <p>클라임픽 다운로드</p>
    <a href="https://apps.apple.com/kr/app/id6789773061">App Store에서 받기</a>
    <a href="https://play.google.com/store/apps/details?id=com.climpick">Google Play에서 받기</a>
    <a href="/" style="background:transparent;color:#F1F5EF">클라임픽 소개 보기</a>
  </noscript>
</body>
</html>
